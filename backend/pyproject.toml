[project]
name = "cameracommander-backend"
version = "0.1.0"
description = "CameraCommander Raspberry Pi Zero 2 W Backend Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
    "pydantic>=2.6.0",
    "gphoto2>=2.6.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = []
